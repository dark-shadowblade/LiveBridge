<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>LiveBridge</title>

  <style>

    :root {
      color-scheme: dark;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    body {
      margin: 0;
      background: #0b0d12;
      color: #f4f6fb;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .muted {
      color: #9da5b5;
    }

    .card {
      background: #141821;
      border: 1px solid #252b38;
      border-radius: 16px;
      padding: 18px;
      margin-top: 18px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #343b4a;
      background: #0e1118;
      color: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 17px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      background: #6d43ff;
      color: white;
    }

    .danger {
      background: #b52f3d;
      color: white;
    }

    .secondary {
      background: #303747;
      color: white;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .account-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .account-info {
      flex: 1;
      min-width: 200px;
    }

    .account-name {
      font-weight: 700;
      font-size: 16px;
    }

    .account-email {
      color: #9da5b5;
      font-size: 13px;
      margin-top: 3px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #303747;
    }

    .status {
      font-weight: 700;
    }

    .success {
      color: #5de49a;
    }

    .warning {
      color: #ffc857;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 330px;
      overflow: auto;
      background: #090b10;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    a {
      color: #a990ff;
    }

    .small {
      font-size: 12px;
      color: #9da5b5;
      margin-top: 8px;
    }

  </style>

</head>


<body>

<main>

  <h1>LiveBridge</h1>

  <div class="muted">
    Real-time Bilibili LIVE → YouTube vertical LIVE relay
  </div>


  <!-- =====================================================
       YOUTUBE ACCOUNTS
  ====================================================== -->

  <div class="card">

    <div
      id="authStatus"
      class="status"
    >
      Checking YouTube accounts…
    </div>


    <label for="accountSelect">
      YouTube account
    </label>


    <select
      id="accountSelect"
    >

      <option value="">
        No YouTube account
      </option>

    </select>


    <div
      id="selectedAccount"
      class="account-row"
      style="margin-top:14px;"
    ></div>


    <div class="row">

      <button
        class="primary"
        id="addAccount"
        type="button"
      >
        + Add YouTube account
      </button>


      <button
        class="secondary"
        id="removeAccount"
        type="button"
      >
        Remove selected
      </button>

    </div>


    <div class="small">
      Refreshing the page will keep the selected account.
      Add as many Google/YouTube accounts as you need.
    </div>

  </div>


  <!-- =====================================================
       LIVE FORM
  ====================================================== -->

  <div class="card">

    <form id="form">

      <label for="source">
        Bilibili LIVE URL
      </label>

      <input
        id="source"
        required
        placeholder="https://live.bilibili.com/..."
        autocomplete="off"
      >


      <label for="title">
        YouTube Live title
      </label>

      <input
        id="title"
        value="LiveBridge LIVE"
        maxlength="100"
        required
      >


      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Optional"
      ></textarea>


      <label for="privacy">
        Visibility
      </label>

      <select id="privacy">

        <option value="unlisted">
          Unlisted — first test
        </option>

        <option value="private">
          Private
        </option>

        <option value="public">
          Public
        </option>

      </select>


      <div class="row">

        <button
          class="primary"
          type="submit"
          id="startButton"
        >
          START LIVE
        </button>


        <button
          class="danger"
          id="stop"
          type="button"
        >
          STOP
        </button>

      </div>

    </form>

  </div>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div class="card">

    <div>
      Status:
      <span
        id="status"
        class="status"
      >
        IDLE
      </span>
    </div>


    <div id="link"></div>


    <pre id="logs">
Waiting…
    </pre>

  </div>

</main>


<script>

const $ =
  (id) =>
    document.getElementById(id);


let accounts = [];

let currentAccountId = null;


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================================================
   LOAD ACCOUNTS
========================================================= */

async function loadAccounts() {

  try {

    const response =
      await fetch(
        "/api/accounts",
        {
          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    accounts =
      data.accounts ||
      [];


    currentAccountId =
      data.currentAccountId ||
      null;


    renderAccounts();

  } catch (error) {

    $("authStatus").textContent =
      "Could not load YouTube accounts.";

    console.error(
      error
    );
  }
}


/* =========================================================
   RENDER ACCOUNT DROPDOWN
========================================================= */

function renderAccounts() {

  const select =
    $("accountSelect");


  select.innerHTML = "";


  if (
    accounts.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      "";

    option.textContent =
      "No YouTube account — add one";

    select.appendChild(
      option
    );


    $("authStatus").textContent =
      "YouTube not authorized";

    $("selectedAccount").innerHTML =
      "";

    $("startButton").disabled =
      true;

    $("removeAccount").disabled =
      true;

    return;
  }


  $("startButton").disabled =
    false;

  $("removeAccount").disabled =
    false;


  for (
    const account of accounts
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      account.id;


    option.textContent =
      account.email
        ? `${account.name} — ${account.email}`
        : account.name;


    if (
      account.id ===
      currentAccountId
    ) {

      option.selected =
        true;
    }


    select.appendChild(
      option
    );
  }


  const current =
    accounts.find(
      (account) =>
        account.id ===
        currentAccountId
    );


  if (current) {

    $("authStatus").innerHTML =
      `<span class="success">✓ YouTube authorized</span>`;


    const picture =
      current.picture
        ? `<img class="avatar" src="${escapeHtml(current.picture)}" alt="">`
        : `<div class="avatar"></div>`;


    $("selectedAccount").innerHTML =

      picture +

      `<div class="account-info">
        <div class="account-name">
          ${escapeHtml(current.name)}
        </div>
        <div class="account-email">
          ${escapeHtml(current.email)}
        </div>
      </div>`;
  }
}


/* =========================================================
   SELECT ACCOUNT
========================================================= */

$("accountSelect")
  .addEventListener(
    "change",
    async () => {

      const accountId =
        $("accountSelect")
          .value;


      if (!accountId) {
        return;
      }


      const response =
        await fetch(
          "/api/accounts/select",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                accountId
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Could not select account."
        );

        await loadAccounts();

        return;
      }


      currentAccountId =
        accountId;


      renderAccounts();

      await refresh();
    }
  );


/* =========================================================
   ADD ACCOUNT
========================================================= */

$("addAccount")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "/auth/youtube/start";
    }
  );


/* =========================================================
   REMOVE ACCOUNT
========================================================= */

$("removeAccount")
  .addEventListener(
    "click",
    async () => {

      const account =
        accounts.find(
          (item) =>
            item.id ===
            currentAccountId
        );


      if (!account) {
        return;
      }


      const confirmed =
        confirm(
          `Remove ${account.email || account.name} from LiveBridge?`
        );


      if (!confirmed) {
        return;
      }


      const response =
        await fetch(
          "/api/accounts/remove",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                accountId:
                  account.id
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Could not remove account."
        );

        return;
      }


      currentAccountId =
        null;


      await loadAccounts();

      await refresh();
    }
  );


/* =========================================================
   REFRESH STATUS
========================================================= */

async function refresh() {

  try {

    const response =
      await fetch(
        "/api/status",
        {
          cache:
            "no-store"
        }
      );


    const status =
      await response.json();


    $("status").textContent =
      status.status;


    if (
      status.status ===
      "LIVE"
    ) {

      $("status").className =
        "status success";

    } else if (
      status.status ===
      "ERROR"
    ) {

      $("status").className =
        "status warning";

    } else {

      $("status").className =
        "status";
    }


    $("link").innerHTML =
      status.youtubeUrl

        ? `<p>
            <a
              target="_blank"
              rel="noopener"
              href="${escapeHtml(status.youtubeUrl)}"
            >
              Open YouTube broadcast
            </a>
          </p>`

        : "";


    $("logs").textContent =
      (
        status.logs ||
        []
      ).join("\n") ||
      "Waiting…";


  } catch (error) {

    $("logs").textContent =
      "Dashboard error: " +
      error.message;
  }
}


/* =========================================================
   START LIVE
========================================================= */

$("form")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      if (!currentAccountId) {

        alert(
          "Please select a YouTube account first."
        );

        return;
      }


      $("logs").textContent =
        "Starting…";


      const response =
        await fetch(
          "/api/start",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                sourceUrl:
                  $("source")
                    .value
                    .trim(),

                title:
                  $("title")
                    .value
                    .trim(),

                description:
                  $("description")
                    .value
                    .trim(),

                privacy:
                  $("privacy")
                    .value
              })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok
      ) {

        $("logs").textContent =
          data.error ||
          "Start failed.";

        return;
      }


      refresh();
    }
  );


/* =========================================================
   STOP
========================================================= */

$("stop")
  .addEventListener(
    "click",
    async () => {

      await fetch(
        "/api/stop",
        {
          method:
            "POST"
        }
      );


      refresh();
    }
  );


/* =========================================================
   INITIAL LOAD
========================================================= */

(async () => {

  await loadAccounts();

  await refresh();

})();


/* =========================================================
   STATUS POLLING
========================================================= */

setInterval(
  refresh,
  3000
);

</script>

</body>

</html>
