<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LiveBridge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090a0f;
      color: #f4f4f7;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .container {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 50px 0 80px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      line-height: 1.05;
    }

    .subtitle {
      margin-top: 14px;
      color: #a9abb8;
      font-size: 21px;
      line-height: 1.35;
    }

    .card {
      margin-top: 34px;
      padding: 34px;
      border-radius: 28px;
      background: #151821;
      border: 1px solid #292d39;
      box-shadow:
        0 10px 40px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid #3a3e4d;
      border-radius: 18px;
      background: #090b10;
      color: #f5f5f7;
      padding: 18px 20px;
      font-size: 18px;
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: #7045ff;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .field {
      margin-bottom: 28px;
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      padding: 14px;
      border-radius: 16px;
      background: #0d0f15;
      border: 1px solid #282c38;
    }

    .account-picture {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #292d39;
    }

    .account-name {
      font-size: 17px;
      font-weight: 700;
    }

    .account-email {
      margin-top: 4px;
      color: #999dab;
      font-size: 14px;
      word-break: break-all;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 17px 28px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .primary {
      background: #7042f5;
    }

    .secondary {
      background: #303746;
    }

    .danger {
      background: #a52b35;
    }

    .buttons {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .account-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .account-buttons .primary {
      background: #7042f5;
    }

    .small-text {
      margin-top: 18px;
      color: #9da0ae;
      font-size: 15px;
      line-height: 1.45;
    }

    .status-card {
      margin-top: 34px;
    }

    .status {
      font-size: 21px;
      color: #c2c4cf;
    }

    .status strong {
      color: white;
    }

    .logs {
      margin-top: 18px;
      padding: 20px;
      min-height: 100px;
      max-height: 380px;
      overflow-y: auto;
      border-radius: 18px;
      background: #050609;
      color: #d7d8df;
      font-family:
        monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .youtube-link {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      background: #11131a;
      border: 1px solid #292d39;
    }

    .youtube-link a {
      color: #a889ff;
      text-decoration: none;
      word-break: break-all;
    }

    .loading {
      color: #aeb1bd;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 24px, 760px);
        padding-top: 40px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 20px;
      }

      .card {
        padding: 24px;
        border-radius: 24px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>LiveBridge</h1>

  <div class="subtitle">
    Real-time Bilibili LIVE → YouTube vertical LIVE relay
  </div>


  <!-- =====================================================
       YOUTUBE ACCOUNTS
  ====================================================== -->

  <div class="card">

    <h2>YouTube account</h2>

    <div class="field">

      <select
        id="accountSelect"
        disabled
      >
        <option>
          Checking YouTube accounts...
        </option>
      </select>

    </div>


    <div
      id="accountInfo"
      class="account-info"
      style="display:none;"
    >

      <img
        id="accountPicture"
        class="account-picture"
        alt=""
      >

      <div>
        <div
          id="accountName"
          class="account-name"
        >
        </div>

        <div
          id="accountEmail"
          class="account-email"
        >
        </div>
      </div>

    </div>


    <div class="account-buttons">

      <button
        id="addAccountButton"
        class="primary"
        type="button"
      >
        + Add YouTube account
      </button>

      <button
        id="removeAccountButton"
        class="secondary"
        type="button"
      >
        Remove selected
      </button>

    </div>


    <div class="small-text">
      Refreshing the page will keep the selected account.
      Add as many Google/YouTube accounts as you need.
    </div>

  </div>


  <!-- =====================================================
       LIVE SETTINGS
  ====================================================== -->

  <div class="card">

    <div class="field">

      <label for="sourceUrl">
        Bilibili LIVE URL
      </label>

      <input
        id="sourceUrl"
        type="url"
        value="https://live.bilibili.com/21156534"
        placeholder="https://live.bilibili.com/123456"
      >

    </div>


    <div class="field">

      <label for="title">
        YouTube Live title
      </label>

      <input
        id="title"
        type="text"
        value="LiveBridge LIVE"
        maxlength="100"
      >

    </div>


    <div class="field">

      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Optional"
      ></textarea>

    </div>


    <div class="field">

      <label for="privacy">
        Visibility
      </label>

      <select id="privacy">

        <option value="unlisted">
          Unlisted — first test
        </option>

        <option value="public">
          Public
        </option>

        <option value="private">
          Private
        </option>

      </select>

    </div>


    <div class="buttons">

      <button
        id="startButton"
        class="primary"
        type="button"
      >
        START LIVE
      </button>

      <button
        id="stopButton"
        class="danger"
        type="button"
      >
        STOP
      </button>

    </div>

  </div>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div class="card status-card">

    <div class="status">
      Status:
      <strong id="statusText">
        IDLE
      </strong>
    </div>


    <div
      id="youtubeLink"
      class="youtube-link"
    >
      YouTube:

      <a
        id="youtubeLinkAnchor"
        href="#"
        target="_blank"
        rel="noopener"
      ></a>
    </div>


    <div
      id="logs"
      class="logs"
    >
      Waiting...
    </div>

  </div>

</div>


<script>
"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const accountSelect =
  document.getElementById(
    "accountSelect"
  );

const accountInfo =
  document.getElementById(
    "accountInfo"
  );

const accountPicture =
  document.getElementById(
    "accountPicture"
  );

const accountName =
  document.getElementById(
    "accountName"
  );

const accountEmail =
  document.getElementById(
    "accountEmail"
  );

const addAccountButton =
  document.getElementById(
    "addAccountButton"
  );

const removeAccountButton =
  document.getElementById(
    "removeAccountButton"
  );

const sourceUrl =
  document.getElementById(
    "sourceUrl"
  );

const title =
  document.getElementById(
    "title"
  );

const description =
  document.getElementById(
    "description"
  );

const privacy =
  document.getElementById(
    "privacy"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const statusText =
  document.getElementById(
    "statusText"
  );

const logs =
  document.getElementById(
    "logs"
  );

const youtubeLink =
  document.getElementById(
    "youtubeLink"
  );

const youtubeLinkAnchor =
  document.getElementById(
    "youtubeLinkAnchor"
  );


/* =========================================================
   STATE
========================================================= */

let accounts = [];


/*
  IMPORTANT:
  We do NOT use a separate selectedAccountId variable
  for START LIVE.

  The dropdown itself is the source of truth:
      accountSelect.value

  This fixes the bug where the UI showed an account
  but START LIVE thought no account was selected.
*/


/* =========================================================
   API HELPER
========================================================= */

async function api(
  url,
  options = {}
) {
  const response =
    await fetch(
      url,
      {
        credentials:
          "same-origin",

        ...options,

        headers: {
          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );

  let data = null;

  try {
    data =
      await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      `Request failed: ${response.status}`
    );
  }

  return data;
}


/* =========================================================
   UPDATE ACCOUNT INFO
========================================================= */

function updateAccountInfo() {

  const id =
    accountSelect.value;

  const account =
    accounts.find(
      (item) =>
        String(item.id) ===
        String(id)
    );

  if (!account) {

    accountInfo.style.display =
      "none";

    return;
  }


  accountInfo.style.display =
    "flex";


  accountName.textContent =
    account.name ||
    "YouTube channel";


  accountEmail.textContent =
    account.email ||
    "";


  if (account.picture) {

    accountPicture.src =
      account.picture;

    accountPicture.style.display =
      "block";

  } else {

    accountPicture.removeAttribute(
      "src"
    );

    accountPicture.style.display =
      "none";
  }
}


/* =========================================================
   LOAD ACCOUNTS
========================================================= */

async function loadAccounts() {

  accountSelect.disabled =
    true;

  try {

    const data =
      await api(
        "/api/accounts"
      );


    accounts =
      Array.isArray(
        data.accounts
      )
        ? data.accounts
        : [];


    accountSelect.innerHTML =
      "";


    if (!accounts.length) {

      const option =
        document.createElement(
          "option"
        );

      option.value = "";

      option.textContent =
        "No YouTube account — add one";

      accountSelect.appendChild(
        option
      );

      accountSelect.disabled =
        true;

      accountInfo.style.display =
        "none";

      removeAccountButton.disabled =
        true;

      return;
    }


    /*
      Build dropdown.
    */

    for (
      const account of accounts
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(account.id);

      const label =
        account.name ||
        account.email ||
        "YouTube channel";

      if (
        account.email
      ) {
        option.textContent =
          `${label} — ${account.email}`;
      } else {
        option.textContent =
          label;
      }

      accountSelect.appendChild(
        option
      );
    }


    /*
      Restore server-selected account.
    */

    const serverSelectedId =
      data.selectedId
        ? String(
            data.selectedId
          )
        : "";


    const exists =
      accounts.some(
        (account) =>
          String(account.id) ===
          serverSelectedId
      );


    if (exists) {

      accountSelect.value =
        serverSelectedId;

    } else {

      /*
        Fallback to first account.
      */

      accountSelect.value =
        String(
          accounts[0].id
        );

      /*
        Tell server which account
        is now selected.
      */

      await selectAccountOnServer(
        accountSelect.value
      );
    }


    accountSelect.disabled =
      false;

    removeAccountButton.disabled =
      false;


    updateAccountInfo();


  } catch (error) {

    console.error(
      "Account loading error:",
      error
    );

    accountSelect.innerHTML =
      "";

    const option =
      document.createElement(
        "option"
      );

    option.value = "";

    option.textContent =
      "Could not load YouTube accounts";

    accountSelect.appendChild(
      option
    );

    accountSelect.disabled =
      true;

    alert(
      error.message
    );
  }
}


/* =========================================================
   SELECT ACCOUNT ON SERVER
========================================================= */

async function selectAccountOnServer(
  accountId
) {

  if (!accountId) {
    return;
  }


  const data =
    await api(
      "/api/accounts/select",
      {
        method:
          "POST",

        body:
          JSON.stringify({
            id:
              accountId
          })
      }
    );


  /*
    Re-sync dropdown from server response.
  */

  if (
    data.selectedId
  ) {

    accountSelect.value =
      String(
        data.selectedId
      );
  }


  updateAccountInfo();
}


/* =========================================================
   DROPDOWN CHANGE
========================================================= */

accountSelect.addEventListener(
  "change",
  async () => {

    /*
      THIS is the important fix.

      The dropdown value is immediately
      the selected account.
    */

    const accountId =
      accountSelect.value;


    updateAccountInfo();


    if (!accountId) {
      return;
    }


    try {

      await selectAccountOnServer(
        accountId
      );

    } catch (error) {

      console.error(
        "Account selection failed:",
        error
      );

      alert(
        `Could not select account: ${error.message}`
      );

      /*
        Reload authoritative server state.
      */

      await loadAccounts();
    }
  }
);


/* =========================================================
   ADD YOUTUBE ACCOUNT
========================================================= */

addAccountButton.addEventListener(
  "click",
  () => {

    window.location.href =
      "/auth/youtube/start";
  }
);


/* =========================================================
   REMOVE SELECTED ACCOUNT
========================================================= */

removeAccountButton.addEventListener(
  "click",
  async () => {

    /*
      Again, use the actual dropdown value.
    */

    const accountId =
      accountSelect.value;


    if (!accountId) {

      alert(
        "No YouTube account is selected."
      );

      return;
    }


    const account =
      accounts.find(
        (item) =>
          String(item.id) ===
          String(accountId)
      );


    const accountNameText =
      account?.name ||
      account?.email ||
      "this account";


    const confirmed =
      confirm(
        `Remove ${accountNameText} from LiveBridge?`
      );


    if (!confirmed) {
      return;
    }


    try {

      await api(
        "/api/accounts/remove",
        {
          method:
            "POST",

          body:
            JSON.stringify({
              id:
                accountId
            })
        }
      );


      await loadAccounts();


    } catch (error) {

      alert(
        `Could not remove account: ${error.message}`
      );
    }
  }
);


/* =========================================================
   START LIVE
========================================================= */

startButton.addEventListener(
  "click",
  async () => {

    /*
      CRITICAL FIX:
      Never use a stale selectedAccountId variable.

      Read directly from the dropdown.
    */

    const accountId =
      accountSelect.value;


    /*
      Verify an actual option exists.
    */

    if (
      !accountId ||
      accountSelect.disabled
    ) {

      alert(
        "Please select a YouTube account first."
      );

      return;
    }


    /*
      Also verify the account exists
      in our loaded account list.
    */

    const account =
      accounts.find(
        (item) =>
          String(item.id) ===
          String(accountId)
      );


    if (!account) {

      alert(
        "The selected YouTube account could not be found. Please reload the accounts."
      );

      await loadAccounts();

      return;
    }


    /*
      Make absolutely sure the server cookie
      points to the same account before starting.
    */

    try {

      await selectAccountOnServer(
        accountId
      );

    } catch (error) {

      alert(
        `Could not select YouTube account: ${error.message}`
      );

      return;
    }


    startButton.disabled =
      true;


    statusText.textContent =
      "STARTING";


    logs.textContent =
      "Starting LiveBridge...";


    try {

      const data =
        await api(
          "/api/start",
          {
            method:
              "POST",

            body:
              JSON.stringify({
                sourceUrl:
                  sourceUrl.value.trim(),

                title:
                  title.value.trim(),

                description:
                  description.value.trim(),

                privacy:
                  privacy.value
              })
          }
        );


      if (
        data.ok
      ) {

        /*
          Server accepted the request.
          The status poll will show the
          actual relay state.
        */

        await refreshStatus();
      }


    } catch (error) {

      console.error(
        "Start error:",
        error
      );

      alert(
        error.message
      );

      await refreshStatus();

    } finally {

      /*
        Don't permanently disable the button.
      */

      startButton.disabled =
        false;
    }
  }
);


/* =========================================================
   STOP LIVE
========================================================= */

stopButton.addEventListener(
  "click",
  async () => {

    try {

      await api(
        "/api/stop",
        {
          method:
            "POST",

          body:
            JSON.stringify({})
        }
      );


      await refreshStatus();


    } catch (error) {

      alert(
        `Could not stop relay: ${error.message}`
      );
    }
  }
);


/* =========================================================
   STATUS
========================================================= */

async function refreshStatus() {

  try {

    const data =
      await api(
        "/api/status"
      );


    statusText.textContent =
      data.status ||
      "IDLE";


    if (
      Array.isArray(
        data.logs
      ) &&
      data.logs.length
    ) {

      logs.textContent =
        data.logs.join(
          "\n"
        );

      logs.scrollTop =
        logs.scrollHeight;

    } else {

      logs.textContent =
        "Waiting...";
    }


    if (
      data.youtubeUrl
    ) {

      youtubeLink.style.display =
        "block";

      youtubeLinkAnchor.href =
        data.youtubeUrl;

      youtubeLinkAnchor.textContent =
        data.youtubeUrl;

    } else {

      youtubeLink.style.display =
        "none";

      youtubeLinkAnchor.href =
        "#";

      youtubeLinkAnchor.textContent =
        "";
    }


    /*
      If the server reports a selected
      account, synchronize the dropdown.
    */

    if (
      data.selectedId &&
      accounts.length
    ) {

      const serverId =
        String(
          data.selectedId
        );

      const exists =
        accounts.some(
          (account) =>
            String(account.id) ===
            serverId
        );


      if (
        exists &&
        accountSelect.value !==
          serverId
      ) {

        accountSelect.value =
          serverId;

        updateAccountInfo();
      }
    }


  } catch (error) {

    console.error(
      "Status refresh failed:",
      error
    );
  }
}


/* =========================================================
   INITIAL LOAD
========================================================= */

async function initialize() {

  await loadAccounts();

  await refreshStatus();
}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  refreshStatus,
  3000
);


/* =========================================================
   START
========================================================= */

initialize();

</script>

</body>
</html>
